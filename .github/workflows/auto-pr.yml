name: auto-pr

on:
  create

jobs:
  create-pr:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout Branch ${{ github.ref_name }}
        uses: actions/checkout@v7
      -
        name: Create Pull Request
        # pass the branch name as a variable - ${{ }} in run is pasted into the script, so a branch name could run code
        run: gh pr create -B main --title "${BRANCH}" --body "Merging branch to create ${BRANCH}."
        env:
          BRANCH: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.PAT }}
